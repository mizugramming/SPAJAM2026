name: Honsen development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared kit when targeting main
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: python tool/check_kit.py
      - name: Validate bundled skills
        run: python tool/check_skills.py
      - name: Test skills validator
        run: python tool/check_skills.py --self-test
      - name: Validate Claude skill entrypoints
        run: python tool/sync_claude_skills.py --check
      - name: Test Claude entrypoint synchronization
        run: python tool/sync_claude_skills.py --self-test
      - name: Test share ZIP generation and verification
        run: python .agents/skills/spajam-share-package/scripts/build_package.py --self-test
      - name: Check whitespace in the proposed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read the project's Flutter version
        id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build apk --debug --no-pub
