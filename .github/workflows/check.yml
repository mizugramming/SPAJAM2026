name: Honban app checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the pinned toolchain
        id: sdk
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          fvm = json.loads(Path('.fvmrc').read_text())
          chain = json.loads(Path('tool/toolchain.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"flutter={fvm['flutter']}\njava={chain['java']}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.sdk.outputs.java }}
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          channel: stable
          cache: true
      - name: Verify Flutter, bundled Dart and Java
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          dart tool/check_environment.dart --android
      - name: Fetch locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check documents, source layout and SDK configuration
        run: python tool/check_kit.py
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build Web preview
        run: flutter build web --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Confirm lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Check whitespace in the proposed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
