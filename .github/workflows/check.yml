name: Honban app checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the pinned toolchain
        id: sdk
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          fvm = json.loads(Path('.fvmrc').read_text())
          chain = json.loads(Path('tool/toolchain.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"flutter={fvm['flutter']}\njava={chain['java']}\n")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.sdk.outputs.java }}
      - uses: android-actions/setup-android@v3
        with:
          # The legacy tools package is no longer distributed by Google.
          # sdkmanager is already supplied by this action's command-line tools.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          channel: stable
          cache: true
      - name: Verify Flutter, bundled Dart and Java
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          dart tool/check_environment.dart --android
      - name: Fetch locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check documents, source layout and SDK configuration
        run: python tool/check_kit.py
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build Web preview
        run: flutter build web --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Confirm lockfile is unchanged
        run: git diff --exit-code -- pubspec.lock
      - name: Check whitespace in the proposed change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
  server:
    name: Server checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Fetch locked server dependencies
        run: npm ci
      - name: Check server types
        run: npm run check
      - name: Test room rules
        run: npm test
      - name: Build Worker without deploying
        run: npm run build
      - name: Exercise two authenticated clients against the local Worker
        env:
          TSUNAGUN_TEST_URL: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          server_log="$RUNNER_TEMP/tsunagun-server.log"
          setsid ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            local result=$?
            trap - EXIT INT TERM
            kill -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$result" -ne 0 ]; then
              cat "$server_log"
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 1 "$TSUNAGUN_TEST_URL/health" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            exit 1
          fi
          npm run test:integration
      - name: Confirm server lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
