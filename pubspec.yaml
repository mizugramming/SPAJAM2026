name: spajam2026
description: "余白が、わたしの宇宙をつくる。端末内で完結する感情記録アプリ。"
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  uuid: ^4.5.2
  intl: ^0.20.2
  table_calendar: ^3.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/common/
    - assets/home/
    - assets/space/
    - assets/star/
    - assets/constellation/
    - assets/universe/
    - assets/history/
    - assets/common/fonts/OFL.txt
    - assets/common/fonts/Roboto-OFL.txt
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/common/fonts/NotoSansJP.ttf
    - family: Roboto
      fonts:
        - asset: assets/common/fonts/Roboto.ttf
