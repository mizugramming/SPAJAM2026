name: polish_workshop
description: 声でやすりを選び、スマホを動かして色を磨き出すゲーム。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.0
  flutter: 3.41.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: WorkshopSans
      fonts:
        - asset: assets/fonts/workshop-sans.ttf
    - family: YujiSyuku
      fonts:
        - asset: assets/fonts/yuji-syuku.ttf
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-YujiSyuku.txt
    - assets/fonts/daou.jpg
    - assets/fonts/gin.jpg
    - assets/fonts/kin.jpg
    - assets/fonts/kinpika.jpg
    - assets/images/background.jpg
    - assets/images/kanji-silver.png
    - assets/images/kanji-silver-polished-aligned.png
    - assets/images/character-02.png
    - assets/images/character-04.png
    - assets/images/character-05.png
    - assets/images/gyansu.jpg
    - assets/images/kyushu-danji.png
    - assets/images/kanji-rank-1.png
    - assets/images/kanji-rank-2.png
    - assets/images/kanji-rank-3.png
    - assets/images/kanji-rank-4.png
    - assets/images/kanji-rank-5.png
    - assets/images/overpolished-01.png
    - assets/images/overpolished-02.png
    - assets/images/overpolished-03.png
    - assets/images/overpolished-04.png
    - assets/images/overpolished-05.png
    - assets/images/medal-gold.png
    - assets/images/medal-gold-polishing.png
    - assets/images/sandpaper_plain.webp
    - assets/images/shavings.png
    - assets/images/shards/copper-1.png
    - assets/images/shards/copper-2.png
    - assets/images/shards/copper-3.png
    - assets/images/shards/copper-4.png
    - assets/images/shards/teal-1.png
    - assets/images/shards/teal-2.png
    - assets/images/shards/teal-3.png
