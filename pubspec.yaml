name: spajam2026
description: "つなぐん — 出会いが仲間になる、一台用デモ"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.11.3 <4.0.0"
  flutter: ">=3.41.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: 6.7.1
  http: 1.6.0
  web_socket_channel: 3.0.3
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  flutter_secure_storage: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/home/
    - assets/audio/
    - assets/fonts/OFL-KaiseiTokumin.txt
    - assets/fonts/OFL-MPlusRounded1c.txt
  fonts:
    - family: KaiseiTokumin
      fonts:
        - asset: assets/fonts/KaiseiTokumin-Medium.ttf
          weight: 500
    - family: MPlusRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
